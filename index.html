<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>happy birth day debosmita ✨</title>
  <style>
    /* FIRST PAGE STYLE — pastel blue minimal + animations */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* first page occupies full view, slowly disappears */
    .greeting-page {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #d4e6f1;        /* soft pastel blue */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Arial', sans-serif;
      z-index: 1000;
      animation: fadeOut 4s ease-in-out forwards;
      animation-delay: 5s;        /* starts fading after 5s */
      pointer-events: none;        /* so nothing is clickable – pure viewing */
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.6);
    }

    /* gentle pulsing / floating animation for the main message */
    @keyframes float {
      0% { transform: translateY(0px) scale(1); opacity: 0.9; }
      50% { transform: translateY(-12px) scale(1.02); opacity: 1; text-shadow: 0 10px 20px rgba(0,30,50,0.15); }
      100% { transform: translateY(0px) scale(1); opacity: 0.9; }
    }

    /* sparkle / shimmer for the heart */
    @keyframes softGlow {
      0% { filter: drop-shadow(0 0 2px #f8a5c2); }
      50% { filter: drop-shadow(0 0 18px #f8a5c2) drop-shadow(0 0 8px #b2d8fa); }
      100% { filter: drop-shadow(0 0 2px #f8a5c2); }
    }

    .greeting-card {
      text-align: center;
      max-width: 650px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(3px);
      border-radius: 60px 20px 60px 20px;
      box-shadow: 0 20px 40px -10px rgba(140, 180, 210, 0.5);
      border: 1px solid rgba(255,255,255,0.7);
      animation: float 3.2s infinite ease-in-out;
    }

    .greeting-card h1 {
      font-size: clamp(2.4rem, 12vw, 4.2rem);
      font-weight: 400;
      color: #2a4f6e;
      letter-spacing: 4px;
      word-break: keep-all;
      margin-bottom: 10px;
      line-height: 1.2;
    }

    .greeting-card h1 span {
      display: inline-block;
      background: rgba(255,255,240,0.5);
      padding: 0 20px;
      border-radius: 120px;
      font-weight: 300;
      font-style: italic;
      border: 1px solid white;
    }

    .debosmita-name {
      font-size: clamp(2.8rem, 13vw, 5rem);
      color: #1f3b4f;
      font-weight: 500;
      margin: 8px 0 0;
      text-transform: lowercase;
      line-height: 1.2;
      background: linear-gradient(145deg, #274e6b, #386282);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 10px rgba(255, 255, 255, 0.7);
    }

    .heart-big {
      font-size: 5rem;
      line-height: 1.2;
      margin: 5px 0 0;
      animation: softGlow 2.4s infinite alternate;
      display: inline-block;
      filter: drop-shadow(0 0 6px #ffb3c6);
    }

    .tiny-note {
      margin-top: 40px;
      font-size: 1.2rem;
      color: #3b5c7a;
      opacity: 0.8;
      font-weight: 300;
      background: rgba(255,255,255,0.4);
      padding: 10px 28px;
      border-radius: 60px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.9);
      animation: float 4s infinite 0.5s;
    }

    /* fade out the whole page */
    @keyframes fadeOut {
      0% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }

    /* second page – hidden until first disappears */
    .second-page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      background: transparent;
      z-index: 1;
      opacity: 0;
      animation: showSecond 0.1ms forwards;
      animation-delay: 9s;        /* appears after first page fully faded + buffer */
    }

    @keyframes showSecond {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* container for the embedded game – we inject the given code inside */
    .game-container {
      width: 100%;
      min-height: 100vh;
      background: #0a1f2e;        /* matches game body background */
    }

    /* ensure no overflow or scroll interference */
    body {
      background: #d4e6f1;        /* pastel blue base, but game overwrites */
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
  </style>
</head>
<body>

  <!-- FIRST PAGE – pastel minimal with animation, disappears after 5 sec -->
  <div class="greeting-page">
    <div class="greeting-card">
      <h1><span>happy</span></h1>
      <h1 style="margin-top: -10px;">birth day</h1>
      <div class="debosmita-name">debosmita</div>
      <div class="heart-big">🩵💙🩵</div>
      <div class="tiny-note">you make the world softer</div>
    </div>
    <!-- extra floating small message to be minimal but warm -->
    <div style="margin-top: 35px; font-size: 1.4rem; color: #2d4f6e; background: rgba(255,255,255,0.2); padding: 10px 30px; border-radius: 60px; backdrop-filter: blur(2px);">✨ today & always ✨</div>
  </div>

  <!-- SECOND PAGE – automatically appears after first disappears (holds the game) -->
  <div class="second-page">
    <div class="game-container">
      <!-- the exact game code from the user, wrapped safely. 
           canvas size etc all preserved. all inline scripts work -->
      <html>
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>Happy Birthday Baby 💖</title>
        <style>
          * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
          }
          body {
            background: linear-gradient(to bottom right, #0a1f2e, #0e2a3a);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            padding: 5px;
          }
          .birthday-title {
            color: #ff9800;
            font-size: clamp(2.2rem, 13vw, 3.8rem);
            margin-top: 10px;
            margin-bottom: 15px;
            text-shadow: 0 0 25px rgba(255, 152, 0, 0.9);
            letter-spacing: 4px;
            animation: glow 2s infinite;
            text-align: center;
            width: 100%;
          }
          @keyframes glow {
            0%, 100% { text-shadow: 0 0 25px rgba(255, 152, 0, 0.9); }
            50% { text-shadow: 0 0 45px rgba(255, 152, 0, 1), 0 0 70px rgba(255, 87, 34, 0.9); }
          }
          .message-box {
            background: rgba(255, 105, 180, 0.15);
            border: 2px solid #ff69b4;
            border-radius: 20px;
            padding: 15px 22px;
            margin: 10px 0 15px;
            width: min(90%, 550px);
            text-align: center;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.4);
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
          }
          .love-message {
            color: #ffb6c1;
            font-size: clamp(15px, 4.5vw, 19px);
            line-height: 1.5;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.6);
            word-wrap: break-word;
            transition: opacity 0.6s ease-in-out;
            opacity: 1;
            animation: fadeGlow 3s infinite alternate;
          }
          .love-message.fade-out { opacity: 0; }
          .love-message.fade-in { opacity: 1; }
          @keyframes fadeGlow {
            0% { text-shadow: 0 0 8px rgba(255, 105, 180, 0.5); }
            100% { text-shadow: 0 0 16px rgba(255, 105, 180, 0.9); }
          }
          #board {
            border: 3px solid #ff69b4;
            border-radius: 15px;
            box-shadow: 0 0 35px rgba(255, 105, 180, 0.6);
            background: #1a2e3a;
            width: min(75vw, 75vh);
            height: min(75vw, 75vh);
            display: block;
            margin: 5px auto;
            touch-action: none;
          }
          .score-container {
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin: 15px 0 10px;
            padding: 8px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 40px;
            border: 2px solid #ff69b4;
            box-shadow: 0 0 25px rgba(255, 105, 180, 0.5);
            letter-spacing: 2px;
          }
          .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
            width: 100%;
            max-width: 350px;
          }
          .direction-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: min(80%, 260px);
            margin: 5px auto;
          }
          .control-btn {
            background: rgba(255, 105, 180, 0.15);
            border: 2.5px solid #ff69b4;
            color: #ff69b4;
            font-size: clamp(28px, 9vw, 38px);
            padding: 12px 0;
            border-radius: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: all 0.1s ease;
            box-shadow: 0 0 18px rgba(255, 105, 180, 0.4);
            aspect-ratio: 1;
            font-weight: bold;
          }
          .control-btn:active {
            background: #ff69b4;
            color: #0a1f2e;
            transform: scale(0.92);
            border-color: #ffb6c1;
            box-shadow: 0 0 25px rgba(255, 105, 180, 0.8);
          }
          .empty { visibility: hidden; }
          .restart-btn {
            background: #ff69b4;
            color: #0a1f2e;
            border: none;
            padding: 14px 40px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 50px;
            margin-top: 20px;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.7);
            border: 2px solid #ff69b4;
            letter-spacing: 3px;
          }
          .restart-btn:active {
            background: transparent;
            color: #ff69b4;
            transform: scale(0.95);
          }
          .restart-hint {
            color: rgba(255, 182, 193, 0.7);
            font-size: 10px;
            margin-top: 8px;
            font-style: italic;
          }
        </style>
      </head>
      <body>
        <div class="birthday-title">🎂 HAPPY BIRTHDAY 🎂</div>
        <div class="message-box">
          <div class="love-message" id="loveMessage" style="opacity: 1;">may be you did't knew that but one glimpse of you was the most beautiful part of my day.</div>
        </div>
        <canvas id="board" width="292" height="292"></canvas>
        <div class="score-container" id="scoreDisplay">❤️ 60 ❤️</div>
        <div class="controls">
          <div class="direction-pad">
            <div class="empty"></div>
            <div class="control-btn" id="btnUp">⬆️</div>
            <div class="empty"></div>
            <div class="control-btn" id="btnLeft">⬅️</div>
            <div class="control-btn" id="btnDown">⬇️</div>
            <div class="control-btn" id="btnRight">➡️</div>
          </div>
          <button class="restart-btn" id="restartBtn">💖 NEW GAME 💖</button>
          <div class="restart-hint">📱 Double-tap canvas • 🖥️ Press Enter</div>
        </div>
        <script>
          (function() {
            const canvas = document.getElementById('board');
            const ctx = canvas.getContext('2d');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const loveMessage = document.getElementById('loveMessage');

            const messages = [
              "The first time I saw you,you were a quiet little calm girl with a soft smile on your face laughing with your friends.",
              "I don’t know why but that very day something special began in my heart for you.",
              "After that I would look for you in the crowd. Whenever I suddenly saw you my heart would fill with happiness for no reason.",
              "Yet I never had the courage to talk to you.",
              "Even today I remember those days when I used to secretly watch you through the window.",
              "may be you did't knew that but one glimpse of you was the most beautiful part of my day.",
              "now many years have passed ahh such a long time But believe me,my feelings have not changed even a little.",
              "Even today when I see you my heart beats just like it did on the very first day.",
              "Maybe I couldn’t say it back then but today I want to say it loud.",
              "I loved you then and I still love you just the same ❤️✨.",
              "I love you debosmita ❤️.",
              "I found my forever in you Baby.",
              "Baby you are my dream come true.",
              "My love for you grows stronger every day Baby.",
              "Baby you are the peace my soul was searching for.",
              "Even in silence my heart speaks your name Baby.",
              "Baby you are the sunshine in my darkest days.",
              "Loving you Baby is the best decision of my life.",
              "Baby you are my sweetest addiction.",
              "My heart belongs only to you Baby.",
              "Baby you are my forever and always.",
              "Every love story is beautiful but ours is my favorite Baby.",
              "Baby your smile is my daily dose of happiness.",
              "I fall for you more and more each day Baby.",
              "Baby you are the queen of my heart.",
              "Your love makes my life complete Baby.",
              "Baby being with you feels like home.",
              "I am lucky to call you mine Baby.",
              "Baby you are my heart's greatest treasure.",
              "No words can express how much I love you Baby.",
              "Baby you are the spark that lights up my life.",
              "With you Baby love feels effortless and pure.",
              "Baby you are the reason I believe in true love.",
              "I choose you every single day Baby.",
              "Baby your love is my strength.",
              "My heart beats only for you Baby.",
              "Baby you are my sweetest blessing.",
              "Loving you Baby is my favorite feeling.",
              "Baby you are my endless happiness.",
              "I can't imagine my life without you Baby.",
              "Baby you are the love I prayed for.",
              "My forever begins and ends with you Baby.",
              "Baby you make my world beautiful.",
              "I am incomplete without you Baby.",
              "Baby your love fills my heart with joy.",
              "Every moment with you Baby is precious.",
              "Baby you are my heart's deepest desire.",
              "I promise to love you endlessly Baby.",
              "Baby you are my once in a lifetime love.",
              "No matter what happens I will always love you Baby. 💖✨"
            ];

            const letterSequence = [
              'I', ' ', 'W', 'A', 'N', 'T', ' ',
              'T', 'O', ' ',
              'K', 'I', 'S', 'S', ' ',
              'Y', 'O', 'U'
            ];

            let currentLetterIndex = 0;

            function resizeCanvas() {
              const size = Math.min(window.innerWidth * 0.75, window.innerHeight * 0.5, 450);
              canvas.width = size;
              canvas.height = size;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            const gridSize = 16;
            let tileCount = 16;
            let cellSize;

            let snake = [];
            let direction = { x: 1, y: 0 };
            let food = {};
            let score = 0;
            let gameRunning = true;
            let gameInterval;

            let currentSpeed = 300;
            const BASE_SPEED = 300;
            const MIN_SPEED = 80;
            const SPEED_DECREMENT = 15;

            let wavePhase = 0;
            const WAVE_SPEED = 0.12;

            let currentMessageIndex = -1;
            let isTransitioning = false;

            let lastTapTime = 0;
            const DOUBLE_TAP_DELAY = 300;

            function updateMessageWithTransition(newMessage) {
              if (isTransitioning) return;
              isTransitioning = true;
              loveMessage.classList.add('fade-out');
              setTimeout(() => {
                loveMessage.textContent = newMessage;
                loveMessage.classList.remove('fade-out');
                loveMessage.classList.add('fade-in');
                setTimeout(() => {
                  loveMessage.classList.remove('fade-in');
                  isTransitioning = false;
                }, 500);
              }, 500);
            }

            function waveAnimation() {
              wavePhase = (wavePhase + WAVE_SPEED) % (Math.PI * 2);
              requestAnimationFrame(waveAnimation);
            }
            waveAnimation();

            function initGame() {
              tileCount = 16;
              cellSize = canvas.width / tileCount;

              snake = [
                { x: 8, y: 8 },
                { x: 7, y: 8 },
                { x: 6, y: 8 }
              ];

              direction = { x: 1, y: 0 };
              score = 0;
              gameRunning = true;
              currentSpeed = BASE_SPEED;
              scoreDisplay.textContent = '❤️ 0 ❤️';
              currentMessageIndex = -1;
              loveMessage.textContent = '💖 Start playing to see your message! 💖';
              loveMessage.style.opacity = '1';
              loveMessage.classList.remove('fade-out', 'fade-in');
              wavePhase = 0;
              currentLetterIndex = 0;

              generateFood();

              if (gameInterval) clearInterval(gameInterval);
              gameInterval = setInterval(gameLoop, currentSpeed);
            }

            function updateSpeed() {
              currentSpeed = Math.max(MIN_SPEED, BASE_SPEED - (Math.floor(score / 10) * SPEED_DECREMENT));
              if (gameInterval) {
                clearInterval(gameInterval);
                gameInterval = setInterval(gameLoop, currentSpeed);
              }
            }

            function generateFood() {
              let validPosition = false;
              let attempts = 0;
              const maxAttempts = 500;

              while (!validPosition && attempts < maxAttempts) {
                food = {
                  x: Math.floor(Math.random() * tileCount),
                  y: Math.floor(Math.random() * tileCount),
                  letter: letterSequence[currentLetterIndex],
                  index: currentLetterIndex
                };

                validPosition = true;
                for (let segment of snake) {
                  if (segment.x === food.x && segment.y === food.y) {
                    validPosition = false;
                    break;
                  }
                }
                attempts++;
              }
              currentLetterIndex = (currentLetterIndex + 1) % letterSequence.length;
            }

            function gameLoop() {
              if (!gameRunning) return;
              update();
              draw();
            }

            function update() {
              if (!gameRunning) return;

              const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
              };

              if (head.x < 0) head.x = tileCount - 1;
              if (head.x >= tileCount) head.x = 0;
              if (head.y < 0) head.y = tileCount - 1;
              if (head.y >= tileCount) head.y = 0;

              for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                  gameOver();
                  return;
                }
              }

              snake.unshift(head);

              if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreDisplay.textContent = `❤️ ${score} ❤️`;

                updateSpeed();

                const messageIndex = Math.floor(score / 10) - 1;
                if (messageIndex >= 0 && messageIndex < messages.length && messageIndex !== currentMessageIndex) {
                  currentMessageIndex = messageIndex;
                  updateMessageWithTransition(messages[messageIndex]);
                } else if (messageIndex >= messages.length && currentMessageIndex !== messages.length - 1) {
                  currentMessageIndex = messages.length - 1;
                  updateMessageWithTransition(messages[messages.length - 1]);
                }

                generateFood();
              } else {
                snake.pop();
              }
            }

            function draw() {
              cellSize = canvas.width / tileCount;

              ctx.fillStyle = '#1a2e3a';
              ctx.fillRect(0, 0, canvas.width, canvas.height);

              ctx.strokeStyle = 'rgba(255, 105, 180, 0.08)';
              ctx.lineWidth = 0.5;
              for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * cellSize, 0);
                ctx.lineTo(i * cellSize, canvas.height);
                ctx.stroke();
                ctx.moveTo(0, i * cellSize);
                ctx.lineTo(canvas.width, i * cellSize);
                ctx.stroke();
              }

              for (let i = 0; i < snake.length; i++) {
                const segment = snake[i];
                const waveOffset = Math.sin(wavePhase - i * 0.7);
                const sizeScale = 0.7 + (waveOffset * 0.3);
                const pinkValue = Math.floor(150 + (105 * (0.5 + waveOffset * 0.2)));
                const glowIntensity = 0.4 + (waveOffset * 0.3);

                if (i === 0) {
                  ctx.fillStyle = `rgb(255, ${Math.min(255, pinkValue + 20)}, 200)`;
                  ctx.shadowBlur = 15 + (glowIntensity * 10);
                  ctx.shadowColor = '#ff69b4';
                } else {
                  ctx.fillStyle = `rgb(255, ${pinkValue}, 160)`;
                  ctx.shadowBlur = 10 + (glowIntensity * 8);
                  ctx.shadowColor = '#ff4d94';
                }

                const basePadding = i === 0 ? 1.5 : 2.5;
                const padding = basePadding - (sizeScale - 1) * 1.2;
                const offset = (cellSize - (cellSize - padding) * sizeScale) / 2;

                ctx.fillRect(
                  segment.x * cellSize + offset,
                  segment.y * cellSize + offset,
                  (cellSize - padding) * sizeScale,
                  (cellSize - padding) * sizeScale
                );
              }
              ctx.shadowBlur = 0;

              if (food.letter) {
                const x = food.x * cellSize + cellSize/2;
                const y = food.y * cellSize + cellSize/2;

                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ff69b4';

                const gradient = ctx.createRadialGradient(x, y, cellSize/6, x, y, cellSize/2);
                gradient.addColorStop(0, '#ff9eb5');
                gradient.addColorStop(1, '#ff69b4');

                ctx.beginPath();
                ctx.arc(x, y, cellSize/2.2, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ffffff';
                ctx.beginPath();
                ctx.arc(x, y, cellSize/2.4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.fill();

                ctx.shadowBlur = 12;
                ctx.shadowColor = '#ff69b4';

                ctx.font = `bold ${cellSize * 0.6}px 'Arial', 'Helvetica', sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                ctx.fillStyle = '#ffffff';
                ctx.fillText(food.letter, x, y);

                ctx.fillStyle = '#ff69b4';
                ctx.fillText(food.letter, x - 1, y - 1);

                if (food.letter === ' ') {
                  ctx.font = `bold ${cellSize * 0.4}px 'Arial', 'Helvetica', sans-serif`;
                  ctx.fillStyle = '#ffffff';
                  ctx.fillText('💌', x, y);
                }
              }
              ctx.shadowBlur = 0;
            }

            function gameOver() {
              gameRunning = false;
              clearInterval(gameInterval);

              ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
              ctx.fillRect(0, 0, canvas.width, canvas.height);

              ctx.fillStyle = '#ff69b4';
              ctx.font = `bold ${Math.max(20, canvas.width * 0.08)}px Arial`;
              ctx.textAlign = 'center';
              ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2 - 30);

              ctx.fillStyle = '#ffb6c1';
              ctx.font = `${Math.max(18, canvas.width * 0.06)}px Arial`;
              ctx.fillText(`❤️ ${score} ❤️`, canvas.width/2, canvas.height/2 + 30);

              ctx.fillStyle = '#fff';
              ctx.font = `${Math.max(14, canvas.width * 0.045)}px Arial`;
              ctx.fillText('💖 Double-tap or Enter to restart 💖', canvas.width/2, canvas.height/2 + 90);
            }

            function setDirection(newDir) {
              if (!gameRunning) return;
              if (snake.length > 1) {
                const head = snake[0];
                const neck = snake[1];
                if (head.x + newDir.x === neck.x && head.y + newDir.y === neck.y) return;
              }
              direction = newDir;
            }

            document.addEventListener('keydown', (e) => {
              switch(e.key) {
                case 'ArrowUp': e.preventDefault(); setDirection({ x: 0, y: -1 }); break;
                case 'ArrowDown': e.preventDefault(); setDirection({ x: 0, y: 1 }); break;
                case 'ArrowLeft': e.preventDefault(); setDirection({ x: -1, y: 0 }); break;
                case 'ArrowRight': e.preventDefault(); setDirection({ x: 1, y: 0 }); break;
                case 'Enter': e.preventDefault(); if (!gameRunning) initGame(); break;
              }
            });

            canvas.addEventListener('touchstart', (e) => {
              e.preventDefault();
              const currentTime = new Date().getTime();
              const tapLength = currentTime - lastTapTime;
              if (tapLength < DOUBLE_TAP_DELAY && tapLength > 0) {
                if (!gameRunning) initGame();
                lastTapTime = 0;
              } else {
                lastTapTime = currentTime;
              }
              touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            });

            document.getElementById('btnUp').addEventListener('click', () => setDirection({ x: 0, y: -1 }));
            document.getElementById('btnDown').addEventListener('click', () => setDirection({ x: 0, y: 1 }));
            document.getElementById('btnLeft').addEventListener('click', () => setDirection({ x: -1, y: 0 }));
            document.getElementById('btnRight').addEventListener('click', () => setDirection({ x: 1, y: 0 }));

            document.getElementById('restartBtn').addEventListener('click', () => initGame());

            let touchStart = null;
            canvas.addEventListener('touchmove', (e) => e.preventDefault());
            canvas.addEventListener('touchend', (e) => {
              e.preventDefault();
              if (!touchStart) return;
              const touchEnd = { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
              const dx = touchEnd.x - touchStart.x;
              const dy = touchEnd.y - touchStart.y;
              if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 20) setDirection({ x: 1, y: 0 });
                else if (dx < -20) setDirection({ x: -1, y: 0 });
              } else {
                if (dy > 20) setDirection({ x: 0, y: 1 });
                else if (dy < -20) setDirection({ x: 0, y: -1 });
              }
              touchStart = null;
            });
            canvas.addEventListener('touchcancel', (e) => { e.preventDefault(); touchStart = null; });

            window.addEventListener('keydown', (e) => {
              if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Enter'].includes(e.key)) e.preventDefault();
            }, false);

            initGame();
          })();
        </script>
      </body>
      </html>
    </div>
  </div>
</body>
</html>
